name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Buat proyek Android dari index.html dan icon.png
        run: |
          set -e
          P=android-app
          J=$P/app/src/main/java/com/codelyrics/app
          mkdir -p $J $P/app/src/main/assets $P/app/src/main/res/values
          cp index.html $P/app/src/main/assets/index.html

          cat > $P/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CodeLyrics"
          include ':app'
          EOF

          cat > $P/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > $P/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > $P/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.codelyrics.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.codelyrics.app'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > $P/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="Code Lyrics"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:allowBackup="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > $J/MainActivity.java <<'EOF'
          package com.codelyrics.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;
              private ValueCallback<Uri[]> chooser;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  web = new WebView(this);
                  web.setBackgroundColor(0xFF050507);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  s.setAllowFileAccessFromFileURLs(true);
                  s.setAllowUniversalAccessFromFileURLs(true);

                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb,
                                                       FileChooserParams p) {
                          if (chooser != null) chooser.onReceiveValue(null);
                          chooser = cb;
                          try {
                              startActivityForResult(p.createIntent(), 1);
                          } catch (Exception e) {
                              chooser = null;
                              return false;
                          }
                          return true;
                      }
                  });
                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  if (req == 1 && chooser != null) {
                      chooser.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data));
                      chooser = null;
                  }
                  super.onActivityResult(req, res, data);
              }
          }
          EOF

          pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          im = Image.open('icon.png').convert('RGBA')
          w, h = im.size
          s = min(w, h)
          l, t = (w - s) // 2, (h - s) // 2
          im = im.crop((l, t, l + s, t + s))
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for d, n in sizes.items():
              out = 'android-app/app/src/main/res/mipmap-' + d
              import os
              os.makedirs(out, exist_ok=True)
              r = im.resize((n, n), Image.LANCZOS)
              r.save(out + '/ic_launcher.png')
              m = Image.new('L', (n * 4, n * 4), 0)
              ImageDraw.Draw(m).ellipse((0, 0, n * 4 - 1, n * 4 - 1), fill=255)
              m = m.resize((n, n), Image.LANCZOS)
              rr = r.copy()
              rr.putalpha(m)
              rr.save(out + '/ic_launcher_round.png')
          PY

      - name: Build APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeLyrics-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Buat Release agar APK mudah diunduh
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Code Lyrics build ${{ github.run_number }}
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
